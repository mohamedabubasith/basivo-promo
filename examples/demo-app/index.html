<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Deploy · Sign in</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="auth">
  <form class="login" id="login" autocomplete="off">
    <div class="brand"><span class="logo">A</span> Acme Deploy</div>
    <h1>Welcome back</h1>
    <label>Email <input id="email" type="email" value="jordan@acme.dev"></label>
    <label>Password <input id="password" type="password" placeholder="••••••••"></label>
    <p class="err" id="err" hidden>Wrong password</p>
    <button id="signin" type="submit">Sign in</button>
  </form>
  <script>
    // Demo only: the password is "demo". Real apps check on the server.
    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault();
      if (document.getElementById("password").value === "demo") location.href = "dashboard.html";
      else document.getElementById("err").hidden = false;
    });
  </script>
</body>
</html>
