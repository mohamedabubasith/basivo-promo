<template id="__ID__-template">
  <!-- basivo-promo screen block: a real recording edited like Screen Studio. Generated by
       `promo screen`; edit the data below or regenerate. Camera, cursor and clicks come from
       the recorded events, already re-timed for the speed ramps. -->
  <div data-composition-id="__ID__" data-width="__W__" data-height="__H__" data-duration="__DUR__">
    <div id="__ID__-stage">
      <div id="__ID__-frame">
        <div id="__ID__-bar"><i></i><i></i><i></i></div>
        <div id="__ID__-screen">
          <div id="__ID__-cam">
            <video id="__ID__-rec" class="clip" data-start="0" data-duration="__DUR__" src="__SRC__" muted playsinline></video>
            <div id="__ID__-ripples"></div>
            <div id="__ID__-cursor"></div>
          </div>
        </div>
      </div>
    </div>

    <style>
      [data-composition-id="__ID__"] { --win-radius: 18px; }
      #__ID__-stage { position: absolute; inset: 0 0 __LIFT__% 0; display: grid; place-items: center; }
      #__ID__-frame { position: relative; overflow: hidden; border-radius: var(--win-radius); background: #0f1117;
        box-shadow: 0 50px 120px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.10); }
      #__ID__-frame.phone { border-radius: 9% / 4.2%; background: #050506; box-shadow: 0 50px 120px rgba(0,0,0,.5), 0 0 0 2px #34363d; }
      #__ID__-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; padding-left: 20px; background: #1c1f27; }
      #__ID__-bar i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; }
      #__ID__-bar i:nth-child(2) { background: #febc2e; } #__ID__-bar i:nth-child(3) { background: #28c840; }
      #__ID__-screen { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; background: #fff; }
      #__ID__-cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      #__ID__-rec { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #__ID__-cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 3;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35)); }
      #__ID__-cursor.touch { width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, 0.55);
        border: 2px solid rgba(0, 0, 0, 0.35); filter: none; }
      #__ID__-ripples > div { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
        border: 4px solid var(--accent, #6c5cff); z-index: 2; opacity: 0; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const D = __DATA__;
        const id = "__ID__", W = __W__, H = __H__;
        const $ = (s) => document.getElementById(id + "-" + s);
        const frame = $("frame"), bar = $("bar"), screen = $("screen"), cam = $("cam"), cursor = $("cursor"), ripples = $("ripples");

        // Size the window to the recording's shape, as large as the frame allows.
        const phone = D.chrome === "phone", aspect = D.rw / D.rh;
        const barH = D.chrome === "browser" ? Math.round(Math.max(30, W * 0.022)) : 0;
        const bezel = phone ? Math.round(Math.min(W, H) * 0.018) : 0;
        // Leave the bottom band free for captions (title-safe), as an editor would.
        const FIT = __FIT__;
        let sw = Math.min(W * 0.86, (H * FIT - barH) * aspect), sh = sw / aspect;
        if (phone) { sh = H * (FIT - 0.02); sw = sh * aspect; if (sw > W * 0.86) { sw = W * 0.86; sh = sw / aspect; } }
        if (phone) frame.classList.add("phone");
        if (D.chrome !== "browser") bar.style.display = "none";
        gsap.set(frame, { width: sw + bezel * 2, height: sh + barH + bezel * 2 });
        gsap.set(bar, { height: barH });
        gsap.set(screen, { top: barH + bezel, left: bezel, right: bezel, bottom: bezel, borderRadius: phone ? "7% / 3.4%" : 0 });
        gsap.set(cam, { width: sw, height: sh });

        // Cursor: an arrow on desktop, a touch dot on phones; scaled for the frame, not the page.
        if (D.touch) cursor.classList.add("touch");
        else cursor.innerHTML = '<svg viewBox="0 0 32 32" width="100%" height="100%"><path d="M6 3 L6 26 L12 20.5 L16 29.2 L20.2 27.4 L16.2 18.9 L24 18.9 Z" fill="#111" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>';
        const cs = D.touch ? 46 : 34, tipX = D.touch ? cs / 2 : cs * 6 / 32, tipY = D.touch ? cs / 2 : cs * 3 / 32;
        const px = (x) => x * sw - tipX, py = (y) => y * sh - tipY;

        const tl = gsap.timeline({ paused: true });

        // Entrance: the window settles in.
        tl.fromTo(frame, { y: 70, opacity: 0, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0);

        // Camera: zoom toward each action, clamp so the window never shows past its edges.
        const camAt = (k) => {
          const s = k.s, tx = Math.min(0, Math.max(sw - s * sw, sw / 2 - s * k.x * sw)), ty = Math.min(0, Math.max(sh - s * sh, sh / 2 - s * k.y * sh));
          return { scale: s, x: tx, y: ty };
        };
        gsap.set(cam, camAt(D.camera[0]));
        for (let i = 1; i < D.camera.length; i++) {
          const a = D.camera[i - 1], b = D.camera[i], d = b.t - a.t;
          if (d > 0.001) tl.to(cam, Object.assign(camAt(b), { duration: d, ease: b.ease === "none" ? "none" : b.ease }), a.t);
        }

        // Cursor path from the recorded moves; it eases between samples.
        if (D.cursor.length) {
          gsap.set(cursor, { x: px(D.cursor[0][1]), y: py(D.cursor[0][2]), opacity: D.touch ? 0 : 1 });
          for (let i = 1; i < D.cursor.length; i++) {
            const a = D.cursor[i - 1], b = D.cursor[i];
            if (b[0] - a[0] > 0.001) tl.to(cursor, { x: px(b[1]), y: py(b[2]), duration: b[0] - a[0], ease: "sine.inOut" }, a[0]);
          }
        }

        // Clicks: squash the cursor, ripple in the brand colour; touch dots appear only around taps.
        D.clicks.forEach((c, i) => {
          const r = document.createElement("div");
          ripples.appendChild(r);
          gsap.set(r, { left: c[1] * sw, top: c[2] * sh, scale: 0.2 });
          tl.fromTo(r, { opacity: 0.95, scale: 0.2 }, { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, c[0]);
          tl.to(cursor, { scale: 0.8, duration: 0.08, ease: "power2.in", transformOrigin: `${tipX}px ${tipY}px` }, c[0]);
          tl.to(cursor, { scale: 1, duration: 0.3, ease: "back.out(3)" }, c[0] + 0.08);
          if (D.touch) {
            tl.to(cursor, { opacity: 1, duration: 0.18 }, Math.max(0, c[0] - 0.3));
            tl.to(cursor, { opacity: 0, duration: 0.3 }, c[0] + 0.45);
          }
        });

        tl.set({}, {}, D.length); // the block lasts exactly as long as the edited recording
        window.__timelines = window.__timelines || {};
        window.__timelines[id] = tl;
      })();
    </script>
  </div>
</template>
